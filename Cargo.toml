[package]
name = "agent-parser"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Streaming parsers and read-only SQLite readers for coding-agent transcripts"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
regex = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
prost = "0.14"
url = "2"
walkdir = "2.5"
zstd = "0.13"
shlex = "1.3"

[dev-dependencies]
tempfile = "3"

name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install Rust components
        run: rustup component add rustfmt clippy llvm-tools --toolchain stable
      - uses: Swatinem/rust-cache@v2
      - name: Install coverage tool
        run: |
          if ! cargo llvm-cov --version | grep -Fx 'cargo-llvm-cov 0.9.1'; then
            cargo install --locked --version 0.9.1 cargo-llvm-cov
          fi
      - name: Check
        run: just check
